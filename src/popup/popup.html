<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stylespec</title>
    <script src="../shared/theme.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span class="head__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 3C6.9 3 3 6.3 3 10.4c0 2.3 1.2 4.3 3.2 5.7L5.4 20l3.9-2a11 11 0 0 0 2.7.3c5.1 0 9-3.3 9-7.4S17.1 3 12 3Z"
          />
        </svg>
      </span>
      <div class="head__text">
        <strong>Stylespec</strong>
        <span id="siteLabel">Checking this page…</span>
      </div>
      <label class="switch" title="Enable Stylespec everywhere">
        <input type="checkbox" id="masterToggle" />
        <span class="switch__track"><span class="switch__thumb"></span></span>
      </label>
    </header>

    <div id="notice" class="notice" hidden></div>

    <section class="section">
      <p class="section__title">Apply a style now</p>
      <div id="favorites" class="favorites"></div>
    </section>

    <footer class="foot">
      <button class="btn" id="siteToggle" type="button" hidden></button>
      <button class="btn btn--primary" id="manage" type="button">Manage styles</button>
    </footer>

    <p class="hint" id="shortcutHint"></p>

    <script src="../shared/presets.js"></script>
    <script src="../shared/compose.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
